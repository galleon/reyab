# agentrouter — Envoy front door for the hackathon.
# Rendered by render.sh (placeholders __X__ are substituted at start).
#
#  :8080  public  — VS Code. Lists only the 2 OSS models. Chat turns are
#                   mirrored to the recorder (-> Opus shadow) and the primary
#                   answer is copied to the recorder by the Lua filter.
#  :8081  eval    — organizer only (127.0.0.1). All 3 models, no recording.
#  :9901  admin

admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }

static_resources:
  listeners:
  # ======================================================== public :8080 ==
  - name: public
    address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: public
          generate_request_id: true
          stream_idle_timeout: 900s
          request_timeout: 0s
          access_log:
            - name: envoy.access_loggers.stdout
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                log_format:
                  json_format:
                    ts: "%START_TIME%"
                    rid: "%REQ(X-REQUEST-ID)%"
                    team: "%REQ(X-BENCH-TEAM)%"
                    model: "%REQ(X-BENCH-MODEL)%"
                    backend: "%REQ(X-BENCH-BACKEND)%"
                    route: "%REQ(X-BENCH-ROUTE)%"
                    path: "%REQ(:PATH)%"
                    status: "%RESPONSE_CODE%"
                    duration_ms: "%DURATION%"
                    ttfb_ms: "%RESPONSE_DURATION%"
                    bytes_out: "%BYTES_SENT%"
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code: { filename: /etc/envoy/public.lua }
          # vLLM Semantic Router. Disabled for the whole virtual host and
          # re-enabled only on the "auto" route below (ext_proc reads its
          # per-route config after the Lua filter has set x-bench-backend). It classifies the prompt, sets x-selected-model, rewrites
          # "model" in the body and clears the route cache, so the request is
          # re-routed by the x-selected-model routes. Response bodies are not sent
          # to it, so SSE streams to VS Code untouched.
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service:
                envoy_grpc: { cluster_name: semantic_router }
                timeout: 30s
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SEND
                request_body_mode: BUFFERED
                response_body_mode: NONE
                request_trailer_mode: SKIP
                response_trailer_mode: SKIP
              message_timeout: 30s
              failure_mode_allow: true        # router down -> request still served by the default route
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: public
            virtual_hosts:
            - name: api
              domains: ["*"]
              typed_per_filter_config:
                envoy.filters.http.ext_proc:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                  disabled: true
              routes:
              - match: { path: /v1/models }
                direct_response: { status: 200, body: { filename: /etc/envoy/models.json } }
                response_headers_to_add:
                - header: { key: content-type, value: application/json }
              - match: { path: /health }
                direct_response: { status: 200, body: { inline_string: "ok" } }
              - match: { path: /arena }
                route: { cluster: recorder, timeout: 15s }
              - match: { prefix: /arena/api/ }
                route: { cluster: recorder, timeout: 15s }

              # "auto" after the semantic router decided (x-selected-model set by ext_proc)
              - match:
                  prefix: /v1/chat/completions
                  headers:
                  - { name: x-bench-backend, string_match: { exact: vsr } }
                  - { name: x-selected-model, string_match: { exact: "__OSS_A_NAME__" } }
                request_headers_to_add:
                - { header: { key: x-bench-backend, value: oss-a }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                route:
                  cluster: oss_a
                  timeout: 0s
                  idle_timeout: 900s
                  request_mirror_policies:
                  - cluster: recorder
                    disable_shadow_host_suffix_append: true
              - match:
                  prefix: /v1/chat/completions
                  headers:
                  - { name: x-bench-backend, string_match: { exact: vsr } }
                  - { name: x-selected-model, string_match: { exact: "__OSS_B_NAME__" } }
                request_headers_to_add:
                - { header: { key: x-bench-backend, value: oss-b }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                route:
                  cluster: oss_b
                  timeout: 0s
                  idle_timeout: 900s
                  request_mirror_policies:
                  - cluster: recorder
                    disable_shadow_host_suffix_append: true
              # "auto" before the decision: this route turns ext_proc on. If the
              # router is unreachable or picks nothing, the request lands here
              # and is served by model A.
              - match:
                  prefix: /v1/chat/completions
                  headers: [{ name: x-bench-backend, string_match: { exact: vsr } }]
                typed_per_filter_config:
                  envoy.filters.http.ext_proc:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                    overrides: {}
                request_headers_to_add:
                - { header: { key: x-bench-backend, value: oss-a }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                - { header: { key: x-bench-route, value: vsr-fallback }, append_action: OVERWRITE_IF_EXISTS_OR_ADD }
                route:
                  cluster: oss_a
                  timeout: 0s
                  idle_timeout: 900s
                  request_mirror_policies:
                  - cluster: recorder
                    disable_shadow_host_suffix_append: true

              # chat turns: serve from OSS, mirror to recorder (Opus shadow)
              - match:
                  prefix: /v1/chat/completions
                  headers: [{ name: x-bench-backend, string_match: { exact: oss-a } }]
                route:
                  cluster: oss_a
                  timeout: 0s
                  idle_timeout: 900s
                  request_mirror_policies:
                  - cluster: recorder
                    disable_shadow_host_suffix_append: true
              - match:
                  prefix: /v1/chat/completions
                  headers: [{ name: x-bench-backend, string_match: { exact: oss-b } }]
                route:
                  cluster: oss_b
                  timeout: 0s
                  idle_timeout: 900s
                  request_mirror_policies:
                  - cluster: recorder
                    disable_shadow_host_suffix_append: true

              # everything else (e.g. /v1/completions for tab-autocomplete): no shadow
              - match:
                  prefix: /v1/
                  headers: [{ name: x-bench-backend, string_match: { exact: oss-a } }]
                route: { cluster: oss_a, timeout: 0s, idle_timeout: 900s }
              - match:
                  prefix: /v1/
                  headers: [{ name: x-bench-backend, string_match: { exact: oss-b } }]
                route: { cluster: oss_b, timeout: 0s, idle_timeout: 900s }

              - match: { prefix: / }
                direct_response:
                  status: 404
                  body: { inline_string: '{"error":{"message":"not found","type":"invalid_request_error"}}' }

  # ========================================================== eval :8081 ==
  - name: eval
    address: { socket_address: { address: 0.0.0.0, port_value: 8081 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: eval
          generate_request_id: true
          stream_idle_timeout: 900s
          request_timeout: 0s
          access_log:
            - name: envoy.access_loggers.stdout
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                log_format:
                  json_format:
                    ts: "%START_TIME%"
                    rid: "%REQ(X-REQUEST-ID)%"
                    team: "%REQ(X-BENCH-TEAM)%"
                    model: "%REQ(X-BENCH-MODEL)%"
                    backend: "%REQ(X-BENCH-BACKEND)%"
                    route: "%REQ(X-BENCH-ROUTE)%"
                    path: "%REQ(:PATH)%"
                    status: "%RESPONSE_CODE%"
                    duration_ms: "%DURATION%"
                    ttfb_ms: "%RESPONSE_DURATION%"
                    bytes_out: "%BYTES_SENT%"
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code: { filename: /etc/envoy/eval.lua }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: eval
            virtual_hosts:
            - name: eval
              domains: ["*"]
              routes:
              - match:
                  prefix: /v1/
                  headers: [{ name: x-bench-backend, string_match: { exact: oss-a } }]
                route: { cluster: oss_a, timeout: 0s, idle_timeout: 900s }
              - match:
                  prefix: /v1/
                  headers: [{ name: x-bench-backend, string_match: { exact: oss-b } }]
                route: { cluster: oss_b, timeout: 0s, idle_timeout: 900s }
              - match:
                  prefix: /v1/
                  headers: [{ name: x-bench-backend, string_match: { exact: anthropic } }]
                route: { cluster: recorder, prefix_rewrite: /eval/v1/, timeout: 0s, idle_timeout: 900s }
              - match: { prefix: / }
                direct_response: { status: 404, body: { inline_string: "not found" } }

  clusters:
  - name: oss_a
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: oss_a
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: oss-a, port_value: 8000 } } } }] }]
  - name: oss_b
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: oss_b
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: oss-b, port_value: 8000 } } } }] }]
  - name: recorder
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: recorder
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: recorder, port_value: 8000 } } } }] }]
  - name: semantic_router
    type: STRICT_DNS
    connect_timeout: 2s
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: semantic_router
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: semantic-router, port_value: 50051 } } } }] }]
  - name: router
    type: STRICT_DNS
    connect_timeout: 2s
    load_assignment:
      cluster_name: router
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: router, port_value: 8000 } } } }] }]
